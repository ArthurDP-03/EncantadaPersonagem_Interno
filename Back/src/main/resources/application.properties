spring.application.name=encantada-personagem-interno
server.servlet.context-path=/api
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/encantada
spring.datasource.username=encantada
spring.datasource.password=encantada
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG


management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

app.jwt.secret=${JWT_SECRET:YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5}
# app.jwt.expiration-ms=86400000
app.jwt.expiration-ms=900000
app.cors.allowed-origins=http://localhost:5173
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

aws.region=${AWS_REGION:us-east-2}
aws.s3.bucket=${AWS_S3_BUCKET:encantada-personagens}
aws.s3.prefix=${AWS_S3_PREFIX:personagens}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.session-token=${AWS_SESSION_TOKEN:}
aws.s3.endpoint=${AWS_S3_ENDPOINT:}
aws.s3.force-path-style=${AWS_S3_FORCE_PATH_STYLE:false}

logging.level.root=ERROR
logging.level.br.com.encantada=DEBUG
