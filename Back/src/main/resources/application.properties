spring.application.name=encantada-personagem-interno
server.servlet.context-path=/api
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/EncantadaPersonagem
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:PUC@1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.jwt.secret=${JWT_SECRET:YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:5173
